<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 326" width="100%" height="auto" style="border-radius: 14px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', sans-serif;">
  <defs>
    <linearGradient id="sk_glass_fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240B1A" stop-opacity="0.96" />
      <stop offset="60%" stop-color="#12050E" stop-opacity="0.99" />
      <stop offset="100%" stop-color="#1E0815" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="sk_glass_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B5C7" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#801D46" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#451126" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="sk_sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="sk_glow" cx="90%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <filter id="sk_shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="sk_glow_filt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Glass Surface -->
  <g filter="url(#sk_shadow)">
    <rect x="2" y="2" width="916" height="320" rx="14" fill="url(#sk_glass_fill)" />
    <rect x="2" y="2" width="916" height="320" fill="url(#sk_glow)" />
    <rect x="2" y="2" width="916" height="50" rx="14" fill="url(#sk_sheen)" />
    <rect x="2" y="2" width="916" height="320" rx="14" fill="none" stroke="url(#sk_glass_border)" stroke-width="1.6" />
  </g>

  <!-- Header -->
  <g transform="translate(32, 34)">
    <rect x="0" y="0" width="10" height="22" rx="3" fill="#E5B5C7" filter="url(#sk_glow_filt)">
      <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </rect>
    <text x="20" y="16" fill="#F8F0F3" font-size="16" font-weight="800" letter-spacing="1">
      04 // TECHNICAL ARSENAL &amp; MATRIX
    </text>
    <line x1="0" y1="28" x2="856" y2="28" stroke="#451126" stroke-width="1.2" stroke-dasharray="6 4" />
  </g>

  <!-- Row 1: Languages -->
  <g transform="translate(32, 78)">
    <rect x="0" y="0" width="165" height="32" rx="6" fill="#140610" stroke="#701A3D" stroke-width="1" />
    <text x="14" y="21" fill="#E5B5C7" font-size="12" font-weight="700">Languages</text>

    <!-- Pills with distinct offsets -->
    <g transform="translate(180, 0)">
      <g transform="translate(0, 0)">
        <rect width="75" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="37.5" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">Python</text>
      </g>
      <g transform="translate(85, 0)">
        <rect width="65" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="32.5" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">C++</text>
      </g>
      <g transform="translate(160, 0)">
        <rect width="65" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="32.5" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">SQL</text>
      </g>
      <g transform="translate(235, 0)">
        <rect width="68" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="34" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">Bash</text>
      </g>
    </g>
  </g>

  <!-- Row 2: AI & ML -->
  <g transform="translate(32, 122)">
    <rect x="0" y="0" width="165" height="32" rx="6" fill="#140610" stroke="#701A3D" stroke-width="1" />
    <text x="14" y="21" fill="#E5B5C7" font-size="12" font-weight="700">AI &amp; Machine Learning</text>

    <!-- Pills with distinct offsets -->
    <g transform="translate(180, 0)">
      <g transform="translate(0, 0)">
        <rect width="90" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="45" y="20.5" fill="#FFFFFF" font-size="11.5" font-weight="500" text-anchor="middle">LangGraph</text>
      </g>
      <g transform="translate(98, 0)">
        <rect width="90" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="45" y="20.5" fill="#FFFFFF" font-size="11.5" font-weight="500" text-anchor="middle">LangChain</text>
      </g>
      <g transform="translate(196, 0)">
        <rect width="96" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="48" y="20.5" fill="#FFFFFF" font-size="11.5" font-weight="500" text-anchor="middle">TensorFlow</text>
      </g>
      <g transform="translate(300, 0)">
        <rect width="72" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="36" y="20.5" fill="#FFFFFF" font-size="11.5" font-weight="500" text-anchor="middle">YOLOv8</text>
      </g>
      <g transform="translate(380, 0)">
        <rect width="74" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="37" y="20.5" fill="#FFFFFF" font-size="11.5" font-weight="500" text-anchor="middle">YAMNet</text>
      </g>
      <g transform="translate(462, 0)">
        <rect width="72" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="36" y="20.5" fill="#FFFFFF" font-size="11.5" font-weight="500" text-anchor="middle">OpenCV</text>
      </g>
      <g transform="translate(542, 0)">
        <rect width="84" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="42" y="20.5" fill="#FFFFFF" font-size="11.5" font-weight="500" text-anchor="middle">MediaPipe</text>
      </g>
    </g>
  </g>

  <!-- Row 3: Backend & Web -->
  <g transform="translate(32, 166)">
    <rect x="0" y="0" width="165" height="32" rx="6" fill="#140610" stroke="#701A3D" stroke-width="1" />
    <text x="14" y="21" fill="#E5B5C7" font-size="12" font-weight="700">Backend &amp; Services</text>

    <!-- Pills with distinct offsets -->
    <g transform="translate(180, 0)">
      <g transform="translate(0, 0)">
        <rect width="78" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="39" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">FastAPI</text>
      </g>
      <g transform="translate(86, 0)">
        <rect width="84" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="42" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">Streamlit</text>
      </g>
      <g transform="translate(178, 0)">
        <rect width="115" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="57.5" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">RESTful APIs</text>
      </g>
      <g transform="translate(301, 0)">
        <rect width="145" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="72.5" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">Asynchronous I/O</text>
      </g>
    </g>
  </g>

  <!-- Row 4: DevOps & Systems -->
  <g transform="translate(32, 210)">
    <rect x="0" y="0" width="165" height="32" rx="6" fill="#140610" stroke="#701A3D" stroke-width="1" />
    <text x="14" y="21" fill="#E5B5C7" font-size="12" font-weight="700">DevOps &amp; Linux</text>

    <!-- Pills with distinct offsets -->
    <g transform="translate(180, 0)">
      <g transform="translate(0, 0)">
        <rect width="75" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="37.5" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">Docker</text>
      </g>
      <g transform="translate(83, 0)">
        <rect width="102" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="51" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">Kubernetes</text>
      </g>
      <g transform="translate(193, 0)">
        <rect width="98" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="49" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">Arch Linux</text>
      </g>
      <g transform="translate(299, 0)">
        <rect width="85" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="42.5" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">Xubuntu</text>
      </g>
      <g transform="translate(392, 0)">
        <rect width="75" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="37.5" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">GitOps</text>
      </g>
    </g>
  </g>

  <!-- Row 5: Hardware & Edge -->
  <g transform="translate(32, 254)">
    <rect x="0" y="0" width="165" height="32" rx="6" fill="#140610" stroke="#701A3D" stroke-width="1" />
    <text x="14" y="21" fill="#E5B5C7" font-size="12" font-weight="700">Hardware &amp; Edge</text>

    <!-- Pills with distinct offsets -->
    <g transform="translate(180, 0)">
      <g transform="translate(0, 0)">
        <rect width="90" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="45" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">ESP32-S3</text>
      </g>
      <g transform="translate(98, 0)">
        <rect width="130" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="65" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">60GHz mmWave</text>
      </g>
      <g transform="translate(236, 0)">
        <rect width="145" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="72.5" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">UWB Mesh Arrays</text>
      </g>
      <g transform="translate(389, 0)">
        <rect width="140" height="32" rx="6" fill="#200B17" stroke="#451126" stroke-width="1" />
        <text x="70" y="20.5" fill="#FFFFFF" font-size="12" font-weight="500" text-anchor="middle">Wavelet Decomp</text>
      </g>
    </g>
  </g>
</svg>
