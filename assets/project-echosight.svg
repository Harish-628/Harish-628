<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 240" width="100%" height="auto" style="border-radius: 16px; overflow: hidden; background: #0A0207; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="e_bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D0B1F" />
      <stop offset="50%" stop-color="#14030D" />
      <stop offset="100%" stop-color="#3A0822" />
    </linearGradient>

    <radialGradient id="e_right_glow" cx="88%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#991B48" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#550A26" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#14030D" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="e_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A3BC" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#991B48" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#3D061C" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D97298" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="e_sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="e_bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Shell -->
  <rect width="940" height="240" fill="url(#e_bg_grad)" />
  <rect width="940" height="240" fill="url(#e_right_glow)" />
  <rect width="940" height="50" fill="url(#e_sheen)" />
  <rect x="2" y="2" width="936" height="236" rx="15" fill="none" stroke="url(#e_border)" stroke-width="1.6" />

  <!-- Left Content Column -->
  <g transform="translate(42, 32)">
    <!-- Metadata Tag -->
    <text x="0" y="0" fill="#D97298" font-size="10.5" font-weight="700" letter-spacing="1.5" font-family="'Courier New', Courier, monospace">
      01 • COMPUTER VISION • ACOUSTIC AI • 2026
    </text>

    <!-- Main Title in Editorial Serif/Bold -->
    <text x="0" y="34" fill="#FFFFFF" font-size="28" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="-0.3">
      Echo Sight <tspan fill="#E5A3BC" font-size="16" font-family="-apple-system, sans-serif" font-weight="400">// Multimodal Security</tspan>
    </text>

    <!-- Subtitle / One-Liner -->
    <text x="0" y="58" fill="#F8EAF0" font-size="12.5" font-weight="400" fill-opacity="0.9">
      Multimodal autonomous security platform fusing visual tracking with acoustic anomaly detection.
    </text>

    <!-- Built Highlight -->
    <text x="0" y="78" fill="#D97298" font-size="11" font-weight="600" font-family="'Courier New', Courier, monospace">
      BUILT • YOLOv8 visual person tracking + YAMNet acoustic classifier; FastAPI command center
    </text>

    <!-- 3 Key Metric Stats Columns (Sri Tech Signature) -->
    <g transform="translate(0, 114)">
      <!-- Metric 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" fill="#FFFFFF" font-size="20" font-weight="800">Dual-Mode</text>
        <text x="0" y="16" fill="#D97298" font-size="10.5" font-weight="500">vision &amp; acoustic fusion</text>
      </g>

      <!-- Metric 2 -->
      <g transform="translate(150, 0)">
        <text x="0" y="0" fill="#FFFFFF" font-size="20" font-weight="800">98%</text>
        <text x="0" y="16" fill="#D97298" font-size="10.5" font-weight="500">anomaly threat recognition</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(320, 0)">
        <text x="0" y="0" fill="#FFFFFF" font-size="20" font-weight="800">40%</text>
        <text x="0" y="16" fill="#D97298" font-size="10.5" font-weight="500">CPU compute reduction</text>
      </g>
    </g>

    <!-- Technology Pills Row -->
    <g transform="translate(0, 154)">
      <rect x="0" y="0" width="70" height="24" rx="12" fill="#14020C" stroke="#7A1238" stroke-width="1" />
      <text x="35" y="15.5" fill="#E5A3BC" font-size="10.5" font-weight="600" text-anchor="middle">FastAPI</text>

      <rect x="78" y="0" width="85" height="24" rx="12" fill="#14020C" stroke="#7A1238" stroke-width="1" />
      <text x="120.5" y="15.5" fill="#E5A3BC" font-size="10.5" font-weight="600" text-anchor="middle">LangGraph</text>

      <rect x="171" y="0" width="70" height="24" rx="12" fill="#14020C" stroke="#7A1238" stroke-width="1" />
      <text x="206" y="15.5" fill="#E5A3BC" font-size="10.5" font-weight="600" text-anchor="middle">YOLOv8</text>

      <rect x="249" y="0" width="70" height="24" rx="12" fill="#14020C" stroke="#7A1238" stroke-width="1" />
      <text x="284" y="15.5" fill="#E5A3BC" font-size="10.5" font-weight="600" text-anchor="middle">YAMNet</text>

      <rect x="327" y="0" width="85" height="24" rx="12" fill="#14020C" stroke="#7A1238" stroke-width="1" />
      <text x="369.5" y="15.5" fill="#E5A3BC" font-size="10.5" font-weight="600" text-anchor="middle">TensorFlow</text>
    </g>
  </g>

  <!-- Right Graphic Column (State Machine / Threat Detection Diagram) -->
  <g transform="translate(740, 120)">
    <!-- Node 1: Vision Ingest -->
    <g transform="translate(-40, -35)">
      <rect width="70" height="26" rx="6" fill="#14020C" stroke="#7A1238" stroke-width="1.2" />
      <text x="35" y="17" fill="#E5A3BC" font-size="10" font-weight="600" text-anchor="middle">YOLOv8</text>
    </g>

    <!-- Node 2: Audio Ingest -->
    <g transform="translate(-40, 15)">
      <rect width="70" height="26" rx="6" fill="#14020C" stroke="#7A1238" stroke-width="1.2" />
      <text x="35" y="17" fill="#E5A3BC" font-size="10" font-weight="600" text-anchor="middle">YAMNet</text>
    </g>

    <!-- Connecting curved bezier lines -->
    <path d="M 30 -22 C 60 -22 60 -3 80 -3" fill="none" stroke="#FF70A6" stroke-width="1.5" />
    <path d="M 30 28 C 60 28 60 -3 80 -3" fill="none" stroke="#FF70A6" stroke-width="1.5" />

    <!-- Central Fusion Core -->
    <g transform="translate(80, -18)">
      <rect width="80" height="30" rx="8" fill="#3D0B24" stroke="#FF2A6D" stroke-width="1.5" filter="url(#e_bloom)" />
      <text x="40" y="19" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">FUSED</text>
    </g>

    <circle cx="80" cy="-3" r="3" fill="#FFFFFF" />
  </g>
</svg>
