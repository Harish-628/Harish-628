<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 90" width="100%" height="100%" style="border-radius: 10px; overflow: hidden; background: #10070c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', monospace;">
  <defs>
    <linearGradient id="footer_bg_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C" />
      <stop offset="35%" stop-color="#190B12" />
      <stop offset="70%" stop-color="#230917" />
      <stop offset="100%" stop-color="#10070C" />
    </linearGradient>

    <linearGradient id="footer_line_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.1" />
    </linearGradient>

    <filter id="footer_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="90" fill="url(#footer_bg_grad)" />
  <rect x="1" y="1" width="918" height="88" rx="9" fill="none" stroke="#451126" stroke-width="1.2" />

  <!-- Top Accent Beam -->
  <line x1="0" y1="2" x2="920" y2="2" stroke="url(#footer_line_grad)" stroke-width="1.5" />

  <!-- Terminal Status Beacon and Text -->
  <g transform="translate(48, 50)">
    <!-- Pulsing Terminal Light -->
    <circle cx="0" cy="-4" r="5" fill="#C77B9B" filter="url(#footer_glow)">
      <animate attributeName="fill-opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;6;4" dur="2.4s" repeatCount="indefinite" />
    </circle>
    
    <text x="18" y="0" fill="#E5B5C7" font-size="12" font-weight="600" letter-spacing="1.5" font-family="'Courier New', Courier, monospace">
      EOF // HARISH SENTHILRAJA
    </text>

    <text x="260" y="0" fill="#701A3D" font-size="12" font-family="'Courier New', Courier, monospace">•</text>

    <text x="280" y="0" fill="#F8F0F3" font-size="12" font-weight="400" letter-spacing="0.8" fill-opacity="0.9">
      Built with intention &amp; terminal-first precision
    </text>

    <text x="640" y="0" fill="#701A3D" font-size="12" font-family="'Courier New', Courier, monospace">•</text>

    <text x="660" y="0" fill="#C77B9B" font-size="11" font-weight="600" letter-spacing="1" font-family="'Courier New', Courier, monospace">
      STATUS: EXPLORING &amp; SHIPPING
    </text>
  </g>
</svg>
