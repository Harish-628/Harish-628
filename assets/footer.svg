<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 75" width="100%" height="auto" style="border-radius: 10px; overflow: hidden; background: #070205; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', monospace;">
  <defs>
    <linearGradient id="ft_bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080205" />
      <stop offset="40%" stop-color="#18030F" />
      <stop offset="70%" stop-color="#14020C" />
      <stop offset="100%" stop-color="#080205" />
    </linearGradient>

    <linearGradient id="ft_line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1A66" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF1A66" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF1A66" stop-opacity="0" />
    </linearGradient>

    <filter id="ft_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="940" height="75" fill="url(#ft_bg)" />
  <rect x="1" y="1" width="938" height="73" rx="9" fill="none" stroke="#540824" stroke-width="1.2" />

  <!-- Top Accent Laser Line -->
  <line x1="0" y1="2" x2="940" y2="2" stroke="url(#ft_line)" stroke-width="2" />

  <!-- Terminal Status Beacon and Content -->
  <g transform="translate(48, 42)">
    <circle cx="0" cy="-4" r="5" fill="#FF1A66" filter="url(#ft_glow)">
      <animate attributeName="fill-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite" />
    </circle>
    
    <text x="18" y="0" fill="#FFA8C5" font-size="12" font-weight="700" letter-spacing="1.5">
      EOF // HARISH SENTHILRAJA
    </text>

    <text x="260" y="0" fill="#990033" font-size="12">•</text>

    <text x="280" y="0" fill="#FFFFFF" font-size="12" font-weight="400" letter-spacing="0.8">
      Architecting edge intelligence &amp; multi-agent backends
    </text>

    <text x="690" y="0" fill="#990033" font-size="12">•</text>

    <text x="710" y="0" fill="#FF70A6" font-size="11.5" font-weight="700" letter-spacing="1">
      TERMINAL-FIRST
    </text>
  </g>
</svg>
