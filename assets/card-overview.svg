<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="auto" style="border-radius: 14px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', sans-serif;">
  <defs>
    <!-- 3D Glass Fill Gradient -->
    <linearGradient id="ov_glass_fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#220B19" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#140610" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#1F0816" stop-opacity="0.95" />
    </linearGradient>

    <!-- 3D Glass Bevel Border -->
    <linearGradient id="ov_glass_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B5C7" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#8A244E" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#451126" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0.6" />
    </linearGradient>

    <!-- Frosted Sheen -->
    <linearGradient id="ov_glass_sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Wine Glow -->
    <radialGradient id="ov_glow" cx="10%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <!-- Inner Card Glass -->
    <linearGradient id="ov_inner_card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D0D21" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#170612" stop-opacity="0.8" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="ov_drop_shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="ov_glow_filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Glass Card -->
  <g filter="url(#ov_drop_shadow)">
    <rect x="2" y="2" width="916" height="244" rx="14" fill="url(#ov_glass_fill)" />
    <rect x="2" y="2" width="916" height="244" rx="14" fill="url(#ov_glow)" />
    <rect x="2" y="2" width="916" height="60" rx="14" fill="url(#ov_glass_sheen)" />
    <rect x="2" y="2" width="916" height="244" rx="14" fill="none" stroke="url(#ov_glass_border)" stroke-width="1.6" />
  </g>

  <!-- Section Header -->
  <g transform="translate(32, 36)">
    <!-- Pill Indicator -->
    <rect x="0" y="0" width="10" height="22" rx="3" fill="#C77B9B" filter="url(#ov_glow_filter)">
      <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </rect>
    <text x="20" y="16" fill="#F8F0F3" font-size="16" font-weight="800" letter-spacing="1">
      01 // EXECUTIVE OVERVIEW &amp; PHILOSOPHY
    </text>
    <text x="750" y="16" fill="#C77B9B" font-size="11" font-family="'Courier New', monospace" letter-spacing="1.2">
      STATUS: ACTIVE
    </text>
    <line x1="0" y1="28" x2="856" y2="28" stroke="#451126" stroke-width="1.2" stroke-dasharray="6 4" />
  </g>

  <!-- Three 3D Glass Column Cards -->
  <!-- Column 1: Edge AI -->
  <g transform="translate(32, 82)">
    <rect width="270" height="144" rx="10" fill="url(#ov_inner_card)" stroke="#701A3D" stroke-width="1" />
    <rect width="270" height="25" rx="10" fill="url(#ov_glass_sheen)" />
    <!-- Icon & Title -->
    <circle cx="22" cy="24" r="8" fill="#451126" stroke="#C77B9B" stroke-width="1.2" />
    <circle cx="22" cy="24" r="3" fill="#E5B5C7" />
    <text x="38" y="28" fill="#F8F0F3" font-size="13" font-weight="700">Edge AI &amp; Telemetry</text>
    <text x="18" y="56" fill="#E5B5C7" font-size="11.5" font-weight="400" line-height="1.5">
      <tspan x="18" dy="0">• mmWave Radar &amp; Geophone</tspan>
      <tspan x="18" dy="20">• ESP32-S3 Wavelet Decomp</tspan>
      <tspan x="18" dy="20">• Low-latency UWB mesh arrays</tspan>
      <tspan x="18" dy="20">• Real-time seismic anomaly</tspan>
    </text>
  </g>

  <!-- Column 2: Multi-Agent AI -->
  <g transform="translate(325, 82)">
    <rect width="270" height="144" rx="10" fill="url(#ov_inner_card)" stroke="#701A3D" stroke-width="1" />
    <rect width="270" height="25" rx="10" fill="url(#ov_glass_sheen)" />
    <circle cx="22" cy="24" r="8" fill="#451126" stroke="#E5B5C7" stroke-width="1.2" />
    <circle cx="22" cy="24" r="3" fill="#C77B9B" />
    <text x="38" y="28" fill="#F8F0F3" font-size="13" font-weight="700">Multi-Agent Systems</text>
    <text x="18" y="56" fill="#E5B5C7" font-size="11.5" font-weight="400">
      <tspan x="18" dy="0">• LangGraph &amp; LangChain swarms</tspan>
      <tspan x="18" dy="20">• Gemini hybrid query routers</tspan>
      <tspan x="18" dy="20">• Voice-to-UI live synchronization</tspan>
      <tspan x="18" dy="20">• Autonomous ERP &amp; Campus OS</tspan>
    </text>
  </g>

  <!-- Column 3: Systems & Linux -->
  <g transform="translate(618, 82)">
    <rect width="270" height="144" rx="10" fill="url(#ov_inner_card)" stroke="#701A3D" stroke-width="1" />
    <rect width="270" height="25" rx="10" fill="url(#ov_glass_sheen)" />
    <circle cx="22" cy="24" r="8" fill="#451126" stroke="#C77B9B" stroke-width="1.2" />
    <circle cx="22" cy="24" r="3" fill="#E5B5C7" />
    <text x="38" y="28" fill="#F8F0F3" font-size="13" font-weight="700">Systems &amp; Architecture</text>
    <text x="18" y="56" fill="#E5B5C7" font-size="11.5" font-weight="400">
      <tspan x="18" dy="0">• Terminal-first Arch / Xubuntu</tspan>
      <tspan x="18" dy="20">• Docker &amp; Kubernetes container</tspan>
      <tspan x="18" dy="20">• High-concurrency FastAPI</tspan>
      <tspan x="18" dy="20">• GitOps &amp; edge deployment</tspan>
    </text>
  </g>
</svg>
