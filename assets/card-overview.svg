<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" width="100%" height="auto" style="border-radius: 14px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', sans-serif;">
  <defs>
    <!-- 3D Ruby Glass Gradients -->
    <linearGradient id="cov_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240718" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#0E020A" stop-opacity="0.99" />
      <stop offset="100%" stop-color="#1C0513" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="cov_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF70A6" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FF1A66" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#660A2B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFA8C5" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cov_sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cov_pod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#330A22" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#14020C" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cov_pod_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A66" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#400015" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="cov_glow" cx="8%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#FF1A66" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#080205" stop-opacity="0" />
    </radialGradient>

    <filter id="cov_shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="cov_bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base 3D Glass Surface -->
  <g filter="url(#cov_shadow)">
    <rect x="2" y="2" width="936" height="244" rx="14" fill="url(#cov_bg)" />
    <rect x="2" y="2" width="936" height="244" fill="url(#cov_glow)" />
    <rect x="2" y="2" width="936" height="60" rx="14" fill="url(#cov_sheen)" />
    <rect x="2" y="2" width="936" height="244" rx="14" fill="none" stroke="url(#cov_border)" stroke-width="1.6" />
  </g>

  <!-- Section Header -->
  <g transform="translate(32, 36)">
    <rect x="0" y="0" width="10" height="22" rx="3" fill="#FF1A66" filter="url(#cov_bloom)">
      <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </rect>
    <text x="20" y="16" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="1">
      01 // EXECUTIVE OVERVIEW &amp; CORE ARCHITECTURE
    </text>
    <text x="760" y="16" fill="#FF70A6" font-size="11" font-family="'Courier New', monospace" letter-spacing="1.2">
      STATUS: ACTIVE
    </text>
    <line x1="0" y1="28" x2="876" y2="28" stroke="#400015" stroke-width="1.2" stroke-dasharray="6 4" />
  </g>

  <!-- 3 Elevated Glass Pods -->
  <!-- Pod 1: Edge AI -->
  <g transform="translate(32, 82)">
    <rect width="276" height="144" rx="10" fill="url(#cov_pod)" stroke="url(#cov_pod_border)" stroke-width="1.2" />
    <rect width="276" height="25" rx="10" fill="url(#cov_sheen)" />
    <circle cx="22" cy="24" r="8" fill="#400015" stroke="#FF1A66" stroke-width="1.4" />
    <circle cx="22" cy="24" r="3" fill="#FFFFFF" />
    <text x="38" y="28" fill="#FFFFFF" font-size="13" font-weight="700">Edge AI &amp; Telemetry</text>
    <text x="18" y="56" fill="#FFA8C5" font-size="11.5">
      <tspan x="18" dy="0">• 60GHz mmWave &amp; Geophones</tspan>
      <tspan x="18" dy="20">• ESP32-S3 Wavelet Decomp</tspan>
      <tspan x="18" dy="20">• Low-latency UWB mesh relay</tspan>
      <tspan x="18" dy="20">• Real-time seismic anomaly</tspan>
    </text>
  </g>

  <!-- Pod 2: Multi-Agent AI -->
  <g transform="translate(332, 82)">
    <rect width="276" height="144" rx="10" fill="url(#cov_pod)" stroke="url(#cov_pod_border)" stroke-width="1.2" />
    <rect width="276" height="25" rx="10" fill="url(#cov_sheen)" />
    <circle cx="22" cy="24" r="8" fill="#400015" stroke="#FF70A6" stroke-width="1.4" />
    <circle cx="22" cy="24" r="3" fill="#FFFFFF" />
    <text x="38" y="28" fill="#FFFFFF" font-size="13" font-weight="700">Multi-Agent Systems</text>
    <text x="18" y="56" fill="#FFA8C5" font-size="11.5">
      <tspan x="18" dy="0">• LangGraph &amp; LangChain swarms</tspan>
      <tspan x="18" dy="20">• Gemini hybrid query routers</tspan>
      <tspan x="18" dy="20">• Voice-to-UI live synchronization</tspan>
      <tspan x="18" dy="20">• Autonomous ERP &amp; Campus OS</tspan>
    </text>
  </g>

  <!-- Pod 3: Systems & Linux -->
  <g transform="translate(632, 82)">
    <rect width="276" height="144" rx="10" fill="url(#cov_pod)" stroke="url(#cov_pod_border)" stroke-width="1.2" />
    <rect width="276" height="25" rx="10" fill="url(#cov_sheen)" />
    <circle cx="22" cy="24" r="8" fill="#400015" stroke="#FF1A66" stroke-width="1.4" />
    <circle cx="22" cy="24" r="3" fill="#FFFFFF" />
    <text x="38" y="28" fill="#FFFFFF" font-size="13" font-weight="700">Systems &amp; Architecture</text>
    <text x="18" y="56" fill="#FFA8C5" font-size="11.5">
      <tspan x="18" dy="0">• Terminal-first Arch / Xubuntu</tspan>
      <tspan x="18" dy="20">• Docker &amp; Kubernetes container</tspan>
      <tspan x="18" dy="20">• High-concurrency FastAPI</tspan>
      <tspan x="18" dy="20">• GitOps &amp; edge deployment</tspan>
    </text>
  </g>
</svg>
