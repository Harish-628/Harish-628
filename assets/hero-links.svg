<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 44" width="100%" height="auto" style="border-radius: 8px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', monospace;">
  <defs>
    <linearGradient id="link_btn_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#340B21" />
      <stop offset="100%" stop-color="#190410" />
    </linearGradient>
  </defs>

  <!-- Button 1: GitHub -->
  <g transform="translate(0, 4)">
    <rect width="180" height="36" rx="7" fill="url(#link_btn_bg)" stroke="#7A1238" stroke-width="1.2" />
    <text x="14" y="22" fill="#D97298" font-size="10.5" font-weight="800" letter-spacing="1">GITHUB</text>
    <text x="70" y="22" fill="#FFFFFF" font-size="11.5" font-weight="600">HARISH-628</text>
  </g>

  <!-- Button 2: LinkedIn -->
  <g transform="translate(192, 4)">
    <rect width="200" height="36" rx="7" fill="url(#link_btn_bg)" stroke="#7A1238" stroke-width="1.2" />
    <text x="14" y="22" fill="#D97298" font-size="10.5" font-weight="800" letter-spacing="1">LINKEDIN</text>
    <text x="78" y="22" fill="#FFFFFF" font-size="11.5" font-weight="600">HARISH-S</text>
  </g>

  <!-- Button 3: Email -->
  <g transform="translate(404, 4)">
    <rect width="320" height="36" rx="7" fill="url(#link_btn_bg)" stroke="#991B48" stroke-width="1.2" />
    <text x="14" y="22" fill="#FF70A6" font-size="10.5" font-weight="800" letter-spacing="1">EMAIL</text>
    <text x="65" y="22" fill="#FFFFFF" font-size="11" font-weight="600">HARISHSENTHILRAJA628@GMAIL.COM</text>
  </g>

  <!-- Button 4: Focus -->
  <g transform="translate(736, 4)">
    <rect width="204" height="36" rx="7" fill="url(#link_btn_bg)" stroke="#7A1238" stroke-width="1.2" />
    <circle cx="16" cy="18" r="4" fill="#FF2A6D">
      <animate attributeName="fill-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="22" fill="#D97298" font-size="10.5" font-weight="800" letter-spacing="1">STACK</text>
    <text x="80" y="22" fill="#FFFFFF" font-size="11.5" font-weight="600">EDGE AI &amp; OPS</text>
  </g>
</svg>
