<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 180" width="100%" height="auto" style="border-radius: 16px; overflow: hidden; background: #0A0207; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="ab_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D0B1F" />
      <stop offset="50%" stop-color="#14030D" />
      <stop offset="100%" stop-color="#220616" />
    </linearGradient>

    <linearGradient id="ab_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A3BC" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#991B48" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#D97298" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="ab_sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="940" height="180" fill="url(#ab_bg)" />
  <rect width="940" height="40" fill="url(#ab_sheen)" />
  <rect x="2" y="2" width="936" height="176" rx="15" fill="none" stroke="url(#ab_border)" stroke-width="1.6" />

  <g transform="translate(42, 34)">
    <text x="0" y="0" fill="#D97298" font-size="10.5" font-weight="700" letter-spacing="1.5" font-family="'Courier New', Courier, monospace">
      01 // ABOUT
    </text>

    <text x="0" y="32" fill="#FFFFFF" font-size="26" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="-0.3">
      Hello, I'm Harish<tspan fill="#FF2A6D">.</tspan>
    </text>

    <text x="0" y="62" fill="#F8EAF0" font-size="13" font-weight="400" fill-opacity="0.9" line-height="1.5">
      Third-year Artificial Intelligence and Data Science undergraduate at Kongunadu College of Engineering and Technology.
    </text>
    <text x="0" y="82" fill="#F8EAF0" font-size="13" font-weight="400" fill-opacity="0.9">
      Focused on low-latency edge computing, real-time sensor telemetry, and autonomous multi-agent AI ecosystems.
    </text>

    <!-- 3 Core Pillars -->
    <g transform="translate(0, 114)">
      <circle cx="4" cy="-4" r="3.5" fill="#FF2A6D" />
      <text x="14" y="0" fill="#E5A3BC" font-size="12" font-weight="600">Edge AI &amp; Radar DSP</text>

      <circle cx="210" cy="-4" r="3.5" fill="#E5A3BC" />
      <text x="220" y="0" fill="#E5A3BC" font-size="12" font-weight="600">Multi-Agent AI Swarms</text>

      <circle cx="430" cy="-4" r="3.5" fill="#FF2A6D" />
      <text x="440" y="0" fill="#E5A3BC" font-size="12" font-weight="600">Terminal-First Linux Systems</text>
    </g>
  </g>
</svg>
