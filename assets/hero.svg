<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%" style="border-radius: 12px; overflow: hidden; background: #10070c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', 'SF Pro Text', sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="hero_bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190B12" />
      <stop offset="50%" stop-color="#10070C" />
      <stop offset="100%" stop-color="#230917" />
    </linearGradient>

    <!-- Wine Glow Gradient -->
    <radialGradient id="hero_radial_glow" cx="80%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#451126" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="hero_text_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F0F3" />
      <stop offset="60%" stop-color="#E5B5C7" />
      <stop offset="100%" stop-color="#C77B9B" />
    </linearGradient>

    <!-- Accent Beam Gradient -->
    <linearGradient id="hero_laser_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0" />
      <stop offset="50%" stop-color="#E5B5C7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="hero_grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#701A3D" stroke-width="0.75" stroke-opacity="0.22" />
      <circle cx="0" cy="0" r="1" fill="#C77B9B" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="hero_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="hero_soft_glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="920" height="340" fill="url(#hero_bg_grad)" />
  <rect width="920" height="340" fill="url(#hero_radial_glow)" />

  <!-- Technical Grid Overlay -->
  <rect width="920" height="340" fill="url(#hero_grid)" opacity="0.8" />

  <!-- Outer Frame Border -->
  <rect x="1" y="1" width="918" height="338" rx="11" fill="none" stroke="#451126" stroke-width="1.5" stroke-opacity="0.85" />
  <rect x="6" y="6" width="908" height="328" rx="7" fill="none" stroke="#701A3D" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="8 6" />

  <!-- Orbital Geometry / Radar Elements -->
  <g transform="translate(750, 160)" stroke="#C77B9B" fill="none">
    <!-- Outer ring with rotation -->
    <circle r="105" stroke-width="1" stroke-dasharray="14 10" stroke-opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite" />
    </circle>
    
    <!-- Mid ring with counter-rotation -->
    <circle r="75" stroke-width="1.2" stroke-dasharray="6 8 18 8" stroke-opacity="0.45" stroke="#E5B5C7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite" />
    </circle>

    <!-- Innermost pulsing ring -->
    <circle r="45" stroke-width="1.5" stroke-opacity="0.6">
      <animate attributeName="r" values="42;48;42" dur="5s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite" />
    </circle>

    <!-- Center Tech Core -->
    <circle r="6" fill="#E5B5C7" filter="url(#hero_glow)">
      <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle r="16" stroke="#C77B9B" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 3" />

    <!-- Trajectory crosshairs -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#701A3D" stroke-width="0.75" stroke-opacity="0.4" />
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#701A3D" stroke-width="0.75" stroke-opacity="0.4" />
  </g>

  <!-- Left Header Status Pill -->
  <g transform="translate(48, 44)">
    <rect x="0" y="0" width="280" height="26" rx="13" fill="#190B12" stroke="#701A3D" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#C77B9B">
      <animate attributeName="fill-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;4.5;3.5" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="17" fill="#E5B5C7" font-size="11" font-weight="600" letter-spacing="1.2" font-family="'Courier New', Courier, monospace">SYSTEM: ACTIVE // KONGUNADU '28</text>
  </g>

  <!-- Main Name Heading -->
  <g transform="translate(48, 126)">
    <text x="0" y="0" fill="url(#hero_text_grad)" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#hero_soft_glow)">
      HARISH SENTHILRAJA
    </text>
  </g>

  <!-- Primary Subtitle / Title Line -->
  <g transform="translate(48, 162)">
    <text x="0" y="0" fill="#C77B9B" font-size="19" font-weight="600" letter-spacing="0.8">
      AI &amp; Backend Software Engineer
    </text>
  </g>

  <!-- Specialization Descriptor -->
  <g transform="translate(48, 192)">
    <text x="0" y="0" fill="#E5B5C7" font-size="13" font-weight="400" fill-opacity="0.88" letter-spacing="0.2">
      Edge Computing <tspan fill="#701A3D">•</tspan> Multi-Agent AI Architecture <tspan fill="#701A3D">•</tspan> Distributed Systems &amp; Linux
    </text>
  </g>

  <!-- Glowing Separator Laser Line -->
  <g transform="translate(48, 218)">
    <line x1="0" y1="0" x2="620" y2="0" stroke="#451126" stroke-width="1.5" />
    <line x1="0" y1="0" x2="220" y2="0" stroke="url(#hero_laser_grad)" stroke-width="2.5" filter="url(#hero_glow)">
      <animate attributeName="x1" values="0;400;0" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="220;620;220" dur="6s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Tech Tags / Micro Badges -->
  <g transform="translate(48, 252)">
    <!-- Tag 1: Edge AI & Radar -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="138" height="30" rx="6" fill="#190B12" stroke="#451126" stroke-width="1.2" />
      <circle cx="14" cy="15" r="3.5" fill="#C77B9B" />
      <text x="25" y="19" fill="#F8F0F3" font-size="12" font-weight="500">ESP32-S3 / Edge</text>
    </g>

    <!-- Tag 2: LangGraph & Multi-Agent -->
    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="170" height="30" rx="6" fill="#190B12" stroke="#451126" stroke-width="1.2" />
      <circle cx="14" cy="15" r="3.5" fill="#E5B5C7" />
      <text x="25" y="19" fill="#F8F0F3" font-size="12" font-weight="500">LangGraph / Multi-Agent</text>
    </g>

    <!-- Tag 3: FastAPI & Docker -->
    <g transform="translate(332, 0)">
      <rect x="0" y="0" width="150" height="30" rx="6" fill="#190B12" stroke="#451126" stroke-width="1.2" />
      <circle cx="14" cy="15" r="3.5" fill="#701A3D" />
      <text x="25" y="19" fill="#F8F0F3" font-size="12" font-weight="500">FastAPI &amp; Container</text>
    </g>

    <!-- Tag 4: Arch Linux -->
    <g transform="translate(494, 0)">
      <rect x="0" y="0" width="144" height="30" rx="6" fill="#190B12" stroke="#451126" stroke-width="1.2" />
      <circle cx="14" cy="15" r="3.5" fill="#C77B9B" />
      <text x="25" y="19" fill="#F8F0F3" font-size="12" font-weight="500">Arch / Terminal-First</text>
    </g>
  </g>

  <!-- Right Decorative Coordinate & Timestamp -->
  <g transform="translate(48, 312)">
    <text x="0" y="0" fill="#701A3D" font-size="10" font-family="'Courier New', Courier, monospace" letter-spacing="1">
      LOC: 11.2189° N, 78.1674° E (NAMAKKAL) // GITHUB: @Harish-628
    </text>
  </g>
</svg>
