<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="100%" height="auto" style="border-radius: 14px; overflow: hidden; background: #0D050A; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', 'SF Pro Display', sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="hero_bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0A14" />
      <stop offset="40%" stop-color="#0E050B" />
      <stop offset="100%" stop-color="#260919" />
    </linearGradient>

    <!-- Glowing Wine Radial -->
    <radialGradient id="hero_radial_wine" cx="82%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#801D46" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#4A1229" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0E050B" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="hero_radial_left" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#5C1433" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0E050B" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="hero_name_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FCEEF4" />
      <stop offset="100%" stop-color="#E5B5C7" />
    </linearGradient>

    <!-- Sweeping Laser Beam -->
    <linearGradient id="laser_beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0" />
      <stop offset="40%" stop-color="#C77B9B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="60%" stop-color="#E5B5C7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="tech_grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#701A3D" stroke-width="0.8" stroke-opacity="0.25" />
      <circle cx="0" cy="0" r="1.2" fill="#E5B5C7" fill-opacity="0.35" />
    </pattern>

    <!-- Filters -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft_bloom" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Backdrops -->
  <rect width="920" height="350" fill="url(#hero_bg_grad)" />
  <rect width="920" height="350" fill="url(#hero_radial_wine)" />
  <rect width="920" height="350" fill="url(#hero_radial_left)" />
  <rect width="920" height="350" fill="url(#tech_grid)" opacity="0.9" />

  <!-- Borders -->
  <rect x="1" y="1" width="918" height="348" rx="13" fill="none" stroke="#54152F" stroke-width="1.8" />
  <rect x="7" y="7" width="906" height="336" rx="9" fill="none" stroke="#801D46" stroke-width="0.8" stroke-dasharray="8 6" stroke-opacity="0.45" />

  <!-- Animated Waveform Trace (Radar / Geophone signal) -->
  <g transform="translate(0, 320)" opacity="0.6">
    <path d="M 0 0 L 120 0 L 140 -12 L 155 14 L 170 -18 L 185 22 L 200 -28 L 215 18 L 230 -10 L 250 0 L 450 0 L 470 -8 L 485 10 L 500 -12 L 515 8 L 530 0 L 920 0" fill="none" stroke="#C77B9B" stroke-width="1.2" stroke-opacity="0.4">
      <animate attributeName="stroke-dasharray" values="0,1000; 1000,0" dur="8s" repeatCount="indefinite" />
    </path>
    <path d="M 0 0 L 120 0 L 140 -12 L 155 14 L 170 -18 L 185 22 L 200 -28 L 215 18 L 230 -10 L 250 0 L 450 0 L 470 -8 L 485 10 L 500 -12 L 515 8 L 530 0 L 920 0" fill="none" stroke="#FFFFFF" stroke-width="1.8" filter="url(#bloom)" stroke-dasharray="80 840">
      <animate attributeName="stroke-dashoffset" values="920; -920" dur="4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Interactive Radar Orbit Geometry -->
  <g transform="translate(745, 165)" stroke="#C77B9B" fill="none">
    <!-- Outer dashed trajectory -->
    <circle r="115" stroke-width="1" stroke-dasharray="12 10" stroke-opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="45s" repeatCount="indefinite" />
    </circle>
    
    <!-- Rotating satellite node on outer ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="45s" repeatCount="indefinite" />
      <circle cx="115" cy="0" r="4.5" fill="#E5B5C7" filter="url(#bloom)" />
    </g>

    <!-- Middle radar ring -->
    <circle r="80" stroke-width="1.4" stroke-dasharray="8 6 22 6" stroke-opacity="0.55" stroke="#E5B5C7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="25s" repeatCount="indefinite" />
    </circle>

    <!-- Inner pulsing ring -->
    <circle r="48" stroke-width="1.6" stroke-opacity="0.75" stroke="#F8F0F3">
      <animate attributeName="r" values="44;52;44" dur="4s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Core pulse -->
    <circle r="8" fill="#FFFFFF" filter="url(#bloom)">
      <animate attributeName="fill-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="7;9;7" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle r="20" stroke="#E5B5C7" stroke-width="1.2" stroke-dasharray="3 4" stroke-opacity="0.6" />

    <!-- Coordinate Crosshairs -->
    <line x1="-135" y1="0" x2="135" y2="0" stroke="#701A3D" stroke-width="0.8" stroke-opacity="0.5" />
    <line x1="0" y1="-135" x2="0" y2="135" stroke="#701A3D" stroke-width="0.8" stroke-opacity="0.5" />
  </g>

  <!-- Top Status Indicator -->
  <g transform="translate(50, 42)">
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#1A0A14" stroke="#701A3D" stroke-width="1.2" />
    <circle cx="15" cy="14" r="4.5" fill="#C77B9B">
      <animate attributeName="fill-opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.8;5.2;3.8" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" fill="#FCEEF4" font-size="11.5" font-weight="700" letter-spacing="1.4" font-family="'Courier New', Courier, monospace">SYSTEM: ONLINE // KONGUNADU '28</text>
  </g>

  <!-- Big Name Title -->
  <g transform="translate(50, 130)">
    <text x="0" y="0" fill="url(#hero_name_grad)" font-size="46" font-weight="900" letter-spacing="-0.5" filter="url(#soft_bloom)">
      HARISH SENTHILRAJA
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(50, 168)">
    <text x="0" y="0" fill="#E5B5C7" font-size="20" font-weight="700" letter-spacing="0.5">
      AI &amp; Backend Software Engineer
    </text>
  </g>

  <!-- Architecture Specialization Line -->
  <g transform="translate(50, 198)">
    <text x="0" y="0" fill="#F8F0F3" font-size="13.5" font-weight="400" fill-opacity="0.92" letter-spacing="0.3">
      Edge Computing <tspan fill="#C77B9B">•</tspan> Multi-Agent AI Ecosystems <tspan fill="#C77B9B">•</tspan> High-Throughput Distributed Backends
    </text>
  </g>

  <!-- Sweeping Laser Beam Bar -->
  <g transform="translate(50, 224)">
    <line x1="0" y1="0" x2="630" y2="0" stroke="#451126" stroke-width="2" />
    <line x1="0" y1="0" x2="250" y2="0" stroke="url(#laser_beam)" stroke-width="3" filter="url(#bloom)">
      <animate attributeName="x1" values="0;400;0" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="250;650;250" dur="5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Tech Tags Matrix -->
  <g transform="translate(50, 256)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="144" height="32" rx="7" fill="#14070F" stroke="#701A3D" stroke-width="1.2" />
      <circle cx="15" cy="16" r="3.5" fill="#E5B5C7" />
      <text x="26" y="20" fill="#FFFFFF" font-size="12" font-weight="600">ESP32-S3 / Edge</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(156, 0)">
      <rect x="0" y="0" width="176" height="32" rx="7" fill="#14070F" stroke="#701A3D" stroke-width="1.2" />
      <circle cx="15" cy="16" r="3.5" fill="#C77B9B" />
      <text x="26" y="20" fill="#FFFFFF" font-size="12" font-weight="600">LangGraph / Multi-Agent</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(344, 0)">
      <rect x="0" y="0" width="156" height="32" rx="7" fill="#14070F" stroke="#701A3D" stroke-width="1.2" />
      <circle cx="15" cy="16" r="3.5" fill="#E5B5C7" />
      <text x="26" y="20" fill="#FFFFFF" font-size="12" font-weight="600">FastAPI &amp; Container</text>
    </g>

    <!-- Tag 4 -->
    <g transform="translate(512, 0)">
      <rect x="0" y="0" width="152" height="32" rx="7" fill="#14070F" stroke="#701A3D" stroke-width="1.2" />
      <circle cx="15" cy="16" r="3.5" fill="#C77B9B" />
      <text x="26" y="20" fill="#FFFFFF" font-size="12" font-weight="600">Arch / Terminal-First</text>
    </g>
  </g>

  <!-- Location & Metadata -->
  <g transform="translate(50, 314)">
    <text x="0" y="0" fill="#C77B9B" font-size="10.5" font-family="'Courier New', Courier, monospace" letter-spacing="1">
      LOCATION: NAMAKKAL, TAMIL NADU, IN // REPO: github.com/Harish-628
    </text>
  </g>
</svg>
