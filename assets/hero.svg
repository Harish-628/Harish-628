<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" width="100%" height="auto" style="border-radius: 18px; overflow: hidden; background: #0A0207; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Sri Tech Burgundy Gradient -->
    <linearGradient id="sri_hero_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#340B21" />
      <stop offset="40%" stop-color="#190410" />
      <stop offset="80%" stop-color="#0E0209" />
      <stop offset="100%" stop-color="#220616" />
    </linearGradient>

    <!-- Glowing Wine Radial -->
    <radialGradient id="sri_glow" cx="80%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#991B48" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#550A26" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0A0207" stop-opacity="0" />
    </radialGradient>

    <!-- Bevel Border Gradient -->
    <linearGradient id="sri_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A3BC" stop-opacity="0.7" />
      <stop offset="30%" stop-color="#991B48" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#3D061C" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D97298" stop-opacity="0.6" />
    </linearGradient>

    <!-- Top Glass Sheen -->
    <linearGradient id="sri_sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="sri_bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="940" height="350" fill="url(#sri_hero_bg)" />
  <rect width="940" height="350" fill="url(#sri_glow)" />
  <rect width="940" height="70" fill="url(#sri_sheen)" />
  <rect x="2" y="2" width="936" height="346" rx="17" fill="none" stroke="url(#sri_border)" stroke-width="1.6" />

  <!-- Fine Background Grid -->
  <g opacity="0.12" stroke="#FF70A6" stroke-width="0.7">
    <line x1="50" y1="0" x2="50" y2="350" />
    <line x1="200" y1="0" x2="200" y2="350" />
    <line x1="350" y1="0" x2="350" y2="350" />
    <line x1="500" y1="0" x2="500" y2="350" />
    <line x1="650" y1="0" x2="650" y2="350" />
    <line x1="0" y1="90" x2="940" y2="90" />
    <line x1="0" y1="180" x2="940" y2="180" />
    <line x1="0" y1="270" x2="940" y2="270" />
  </g>

  <!-- Top Prompt Pill -->
  <g transform="translate(52, 42)">
    <rect width="270" height="26" rx="13" fill="#14020C" stroke="#7A1238" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#E5A3BC">
      <animate attributeName="fill-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="17" fill="#E5A3BC" font-size="11" font-family="'Courier New', Courier, monospace" font-weight="600" letter-spacing="0.5">
      ~/harish &gt; build intelligent
    </text>
  </g>

  <!-- Tagline Sub-Header -->
  <g transform="translate(52, 92)">
    <text x="0" y="0" fill="#D97298" font-size="11" font-weight="700" letter-spacing="2" font-family="'Courier New', Courier, monospace">
      AI • MULTI-AGENT SYSTEMS • DEEP LEARNING
    </text>
  </g>

  <!-- Single-Word Editorial Name: Harish. -->
  <g transform="translate(52, 160)">
    <text x="0" y="0" fill="#FFFFFF" font-size="62" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="-0.5">
      Harish<tspan fill="#FF2A6D">.</tspan>
    </text>
  </g>

  <!-- Role Subtitle Focused on AI -->
  <g transform="translate(52, 212)">
    <text x="0" y="0" fill="#E5A3BC" font-size="14.5" font-weight="700" letter-spacing="1">
      AI/ML ENGINEER • MULTI-AGENT ARCHITECT • FULL-STACK AI
    </text>
  </g>

  <!-- Philosophy Line -->
  <g transform="translate(52, 240)">
    <text x="0" y="0" fill="#F8EAF0" font-size="13" font-weight="400" fill-opacity="0.88">
      Engineering autonomous intelligence. Designing multi-agent workflows.
    </text>
  </g>

  <!-- Academic Footnote Line -->
  <g transform="translate(52, 288)">
    <line x1="0" y1="-14" x2="560" y2="-14" stroke="#4D0B26" stroke-width="1" />
    <text x="0" y="0" fill="#D97298" font-size="10.5" font-family="'Courier New', Courier, monospace" letter-spacing="1">
      B.TECH IN ARTIFICIAL INTELLIGENCE &amp; DATA SCIENCE • KONGUNADU COLLEGE
    </text>
  </g>

  <!-- Right Side: Circular Editorial Avatar/Emblem Frame with Orbital Arcs -->
  <g transform="translate(760, 175)">
    <!-- Outer delicate orbital arcs -->
    <circle r="115" fill="none" stroke="#D97298" stroke-width="0.8" stroke-dasharray="14 10" stroke-opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite" />
    </circle>
    
    <circle r="92" fill="none" stroke="#FF2A6D" stroke-width="1.2" stroke-dasharray="8 6 22 6" stroke-opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="25s" repeatCount="indefinite" />
    </circle>

    <!-- Portrait Halo Gradient -->
    <radialGradient id="avatar_halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#991B48" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#2D061A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#14020C" stop-opacity="1" />
    </radialGradient>

    <!-- Main Portrait Backing Circle -->
    <circle r="72" fill="url(#avatar_halo)" stroke="#D97298" stroke-width="1.8" />

    <!-- Spider-Man Emblem / Cyber Symbol -->
    <g transform="translate(0, -5) scale(0.65)" fill="#FFFFFF" opacity="0.95">
      <ellipse cx="0" cy="8" rx="8" ry="16" />
      <ellipse cx="0" cy="-10" rx="6" ry="6" />
      <path d="M -4 2 Q -25 -15 -42 -42 Q -38 -20 -10 -4 Z" />
      <path d="M -6 6 Q -35 -2 -48 -18 Q -40 2 -10 10 Z" />
      <path d="M -6 12 Q -38 25 -45 48 Q -35 28 -8 18 Z" />
      <path d="M -4 16 Q -28 42 -32 68 Q -24 45 -6 22 Z" />
      <path d="M 4 2 Q 25 -15 42 -42 Q 38 -20 10 -4 Z" />
      <path d="M 6 6 Q 35 -2 48 -18 Q 40 2 10 10 Z" />
      <path d="M 6 12 Q 38 25 45 48 Q 35 28 8 18 Z" />
      <path d="M 4 16 Q 28 42 32 68 Q 24 45 6 22 Z" />
    </g>

    <!-- Tiny Glowing Orbital Beacon -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite" />
      <circle cx="115" cy="0" r="4.5" fill="#FF70A6" filter="url(#sri_bloom)" />
    </g>
  </g>
</svg>
