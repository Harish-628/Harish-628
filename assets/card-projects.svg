<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="auto" style="border-radius: 14px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', sans-serif;">
  <defs>
    <!-- 3D Glass Gradients -->
    <linearGradient id="prj_bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240B1A" stop-opacity="0.97" />
      <stop offset="50%" stop-color="#12050E" stop-opacity="0.99" />
      <stop offset="100%" stop-color="#1D0714" stop-opacity="0.97" />
    </linearGradient>

    <linearGradient id="prj_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B5C7" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#801D46" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#451126" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="tile_glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E0E22" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#160611" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="tile_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#701A3D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="prj_shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="prj_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base 3D Shell -->
  <g filter="url(#prj_shadow)">
    <rect x="2" y="2" width="916" height="474" rx="14" fill="url(#prj_bg_grad)" />
    <rect x="2" y="2" width="916" height="60" rx="14" fill="url(#sheen)" />
    <rect x="2" y="2" width="916" height="474" rx="14" fill="none" stroke="url(#prj_border)" stroke-width="1.6" />
  </g>

  <!-- Header -->
  <g transform="translate(32, 34)">
    <rect x="0" y="0" width="10" height="22" rx="3" fill="#C77B9B" filter="url(#prj_glow)">
      <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </rect>
    <text x="20" y="16" fill="#F8F0F3" font-size="16" font-weight="800" letter-spacing="1">
      03 // FEATURED ENGINEERING PROJECTS
    </text>
    <text x="730" y="16" fill="#E5B5C7" font-size="11" font-family="'Courier New', monospace" letter-spacing="1">
      HARDWARE • MULTI-AGENT
    </text>
    <line x1="0" y1="28" x2="856" y2="28" stroke="#451126" stroke-width="1.2" stroke-dasharray="6 4" />
  </g>

  <!-- 4 Project 3D Glass Tiles (2x2 Grid) -->

  <!-- Tile 1: PRISM (Top-Left) -->
  <g transform="translate(32, 80)">
    <rect width="418" height="180" rx="10" fill="url(#tile_glass)" stroke="url(#tile_border)" stroke-width="1.2" />
    <rect width="418" height="24" rx="10" fill="url(#sheen)" />
    
    <text x="18" y="26" fill="#FFFFFF" font-size="16" font-weight="800">🚨 PRISM</text>
    <text x="110" y="26" fill="#C77B9B" font-size="12" font-weight="600">// Predictive Rescue Intel</text>

    <text x="18" y="52" fill="#E5B5C7" font-size="11.5">
      <tspan x="18" dy="0">• 60GHz mmWave radar &amp; 24-bit geophone sensor fusion</tspan>
      <tspan x="18" dy="18">• Edge-AI Wavelet Packet Decomp on ESP32-S3 microcontrollers</tspan>
      <tspan x="18" dy="18">• Subterranean UWB mesh telemetry for real-time anomaly</tspan>
    </text>

    <!-- Pill Badges -->
    <g transform="translate(18, 126)">
      <rect x="0" y="0" width="76" height="22" rx="4" fill="#140610" stroke="#701A3D" stroke-width="0.8" />
      <text x="8" y="15" fill="#F8F0F3" font-size="10.5">ESP32-S3</text>

      <rect x="84" y="0" width="70" height="22" rx="4" fill="#140610" stroke="#701A3D" stroke-width="0.8" />
      <text x="92" y="15" fill="#F8F0F3" font-size="10.5">Edge AI</text>

      <rect x="162" y="0" width="88" height="22" rx="4" fill="#140610" stroke="#701A3D" stroke-width="0.8" />
      <text x="170" y="15" fill="#F8F0F3" font-size="10.5">mmWave Radar</text>

      <rect x="258" y="0" width="78" height="22" rx="4" fill="#140610" stroke="#701A3D" stroke-width="0.8" />
      <text x="266" y="15" fill="#F8F0F3" font-size="10.5">UWB Mesh</text>
    </g>
  </g>

  <!-- Tile 2: Echo Sight (Top-Right) -->
  <g transform="translate(470, 80)">
    <rect width="418" height="180" rx="10" fill="url(#tile_glass)" stroke="url(#tile_border)" stroke-width="1.2" />
    <rect width="418" height="24" rx="10" fill="url(#sheen)" />

    <text x="18" y="26" fill="#FFFFFF" font-size="16" font-weight="800">👁️ Echo Sight</text>
    <text x="135" y="26" fill="#C77B9B" font-size="12" font-weight="600">// Multimodal Security</text>

    <text x="18" y="52" fill="#E5B5C7" font-size="11.5">
      <tspan x="18" dy="0">• Vision tracking (YOLOv8) + Acoustic anomaly (YAMNet)</tspan>
      <tspan x="18" dy="18">• Dynamic compute allocation &amp; baseline patrol bypass for CPU</tspan>
      <tspan x="18" dy="18">• Tactical command center UI with FastAPI &amp; LangGraph</tspan>
    </text>

    <!-- Pill Badges -->
    <g transform="translate(18, 126)">
      <rect x="0" y="0" width="65" height="22" rx="4" fill="#140610" stroke="#701A3D" stroke-width="0.8" />
      <text x="8" y="15" fill="#F8F0F3" font-size="10.5">FastAPI</text>

      <rect x="73" y="0" width="80" height="22" rx="4" fill="#140610" stroke="#701A3D" stroke-width="0.8" />
      <text x="81" y="15" fill="#F8F0F3" font-size="10.5">LangGraph</text>

      <rect x="161" y="0" width="65" height="22" rx="4" fill="#140610" stroke="#701A3D" stroke-width="0.8" />
      <text x="169" y="15" fill="#F8F0F3" font-size="10.5">YOLOv8</text>

      <rect x="234" y="0" width="65" height="22" rx="4" fill="#140610" stroke="#701A3D" stroke-width="0.8" />
      <text x="242" y="15" fill="#F8F0F3" font-size="10.5">YAMNet</text>
    </g>
  </g>

  <!-- Tile 3: NeuralKPI (Bottom-Left) -->
  <g transform="translate(32, 276)">
    <rect width="418" height="180" rx="10" fill="url(#tile_glass)" stroke="url(#tile_border)" stroke-width="1.2" />
    <rect width="418" height="24" rx="10" fill="url(#sheen)" />

    <text x="18" y="26" fill="#FFFFFF" font-size="16" font-weight="800">🧠 NeuralKPI</text>
    <text x="135" y="26" fill="#C77B9B" font-size="12" font-weight="600">// AI-Native Campus OS</text>

    <text x="18" y="52" fill="#E5B5C7" font-size="11.5">
      <tspan x="18" dy="0">• Autonomous multi-agent college ERP system architecture</tspan>
      <tspan x="18" dy="18">• Dynamic routing engine powered by Gemini hybrid models</tspan>
      <tspan x="18" dy="18">• Synchronized voice-to-UI pipelines for institutional queries</tspan>
    </text>

    <!-- Pill Badges -->
    <g transform="translate(18, 126)">
      <rect x="0" y="0" width="85" height="22" rx="4" fill="#140610" stroke="#701A3D" stroke-width="0.8" />
      <text x="8" y="15" fill="#F8F0F3" font-size="10.5">Multi-Agent</text>

      <rect x="93" y="0" width="85" height="22" rx="4" fill="#140610" stroke="#701A3D" stroke-width="0.8" />
      <text x="101" y="15" fill="#F8F0F3" font-size="10.5">Gemini API</text>

      <rect x="186" y="0" width="80" height="22" rx="4" fill="#140610" stroke="#701A3D" stroke-width="0.8" />
      <text x="194" y="15" fill="#F8F0F3" font-size="10.5">LangGraph</text>

      <rect x="274" y="0" width="60" height="22" rx="4" fill="#140610" stroke="#701A3D" stroke-width="0.8" />
      <text x="282" y="15" fill="#F8F0F3" font-size="10.5">Voice UI</text>
    </g>
  </g>

  <!-- Tile 4: Bharat AI Assistant (Bottom-Right) -->
  <g transform="translate(470, 276)">
    <rect width="418" height="180" rx="10" fill="url(#tile_glass)" stroke="url(#tile_border)" stroke-width="1.2" />
    <rect width="418" height="24" rx="10" fill="url(#sheen)" />

    <text x="18" y="26" fill="#FFFFFF" font-size="16" font-weight="800">📱 Bharat AI Assistant</text>
    <text x="200" y="26" fill="#C77B9B" font-size="12" font-weight="600">// On-Device Mobile AI</text>

    <text x="18" y="52" fill="#E5B5C7" font-size="11.5">
      <tspan x="18" dy="0">• Offline-first regional assistant optimized for native hardware</tspan>
      <tspan x="18" dy="18">• Localized inference with zero external cloud dependencies</tspan>
      <tspan x="18" dy="18">• Privacy-preserving regional language comprehension engine</tspan>
    </text>

    <!-- Pill Badges -->
    <g transform="translate(18, 126)">
      <rect x="0" y="0" width="85" height="22" rx="4" fill="#140610" stroke="#701A3D" stroke-width="0.8" />
      <text x="8" y="15" fill="#F8F0F3" font-size="10.5">Offline-First</text>

      <rect x="93" y="0" width="85" height="22" rx="4" fill="#140610" stroke="#701A3D" stroke-width="0.8" />
      <text x="101" y="15" fill="#F8F0F3" font-size="10.5">On-Device AI</text>

      <rect x="186" y="0" width="85" height="22" rx="4" fill="#140610" stroke="#701A3D" stroke-width="0.8" />
      <text x="194" y="15" fill="#F8F0F3" font-size="10.5">Mobile Edge</text>

      <rect x="279" y="0" width="55" height="22" rx="4" fill="#140610" stroke="#701A3D" stroke-width="0.8" />
      <text x="287" y="15" fill="#F8F0F3" font-size="10.5">Python</text>
    </g>
  </g>
</svg>
