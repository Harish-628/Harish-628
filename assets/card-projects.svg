<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="auto" style="border-radius: 14px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', sans-serif;">
  <defs>
    <!-- 3D Glass Gradients -->
    <linearGradient id="cprj_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240718" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#0E020A" stop-opacity="0.99" />
      <stop offset="100%" stop-color="#1C0513" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="cprj_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF70A6" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FF1A66" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#660A2B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFA8C5" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="tile_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#330A22" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#14020C" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="tile_border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A66" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#80002A" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FF70A6" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="cprj_sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="cprj_shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="cprj_bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Outer Shell -->
  <g filter="url(#cprj_shadow)">
    <rect x="2" y="2" width="936" height="474" rx="14" fill="url(#cprj_bg)" />
    <rect x="2" y="2" width="936" height="60" rx="14" fill="url(#cprj_sheen)" />
    <rect x="2" y="2" width="936" height="474" rx="14" fill="none" stroke="url(#cprj_border)" stroke-width="1.6" />
  </g>

  <!-- Header -->
  <g transform="translate(32, 34)">
    <rect x="0" y="0" width="10" height="22" rx="3" fill="#FF1A66" filter="url(#cprj_bloom)">
      <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </rect>
    <text x="20" y="16" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="1">
      03 // FEATURED ENGINEERING PROJECTS
    </text>
    <text x="740" y="16" fill="#FF70A6" font-size="11" font-family="'Courier New', monospace" letter-spacing="1">
      HARDWARE • MULTI-AGENT
    </text>
    <line x1="0" y1="28" x2="876" y2="28" stroke="#400015" stroke-width="1.2" stroke-dasharray="6 4" />
  </g>

  <!-- 4 Project Modules (2x2 Grid) -->

  <!-- Tile 1: PRISM -->
  <g transform="translate(32, 80)">
    <rect width="428" height="180" rx="10" fill="url(#tile_bg)" stroke="url(#tile_border_grad)" stroke-width="1.2" />
    <rect width="428" height="24" rx="10" fill="url(#cprj_sheen)" />
    
    <text x="18" y="26" fill="#FFFFFF" font-size="16" font-weight="800">🚨 PRISM</text>
    <text x="110" y="26" fill="#FF70A6" font-size="12" font-weight="600">// Predictive Rescue Intel</text>

    <text x="18" y="52" fill="#FFA8C5" font-size="11.5">
      <tspan x="18" dy="0">• 60GHz mmWave radar &amp; 24-bit geophone sensor fusion</tspan>
      <tspan x="18" dy="18">• Edge-AI Wavelet Packet Decomp on ESP32-S3 microcontrollers</tspan>
      <tspan x="18" dy="18">• Subterranean UWB mesh telemetry for real-time anomaly</tspan>
    </text>

    <!-- Badges -->
    <g transform="translate(18, 126)">
      <rect x="0" y="0" width="76" height="22" rx="4" fill="#14020C" stroke="#FF1A66" stroke-width="0.8" />
      <text x="10" y="15" fill="#FFFFFF" font-size="10.5">ESP32-S3</text>

      <rect x="84" y="0" width="70" height="22" rx="4" fill="#14020C" stroke="#FF1A66" stroke-width="0.8" />
      <text x="94" y="15" fill="#FFFFFF" font-size="10.5">Edge AI</text>

      <rect x="162" y="0" width="92" height="22" rx="4" fill="#14020C" stroke="#FF1A66" stroke-width="0.8" />
      <text x="170" y="15" fill="#FFFFFF" font-size="10.5">mmWave Radar</text>

      <rect x="262" y="0" width="80" height="22" rx="4" fill="#14020C" stroke="#FF1A66" stroke-width="0.8" />
      <text x="270" y="15" fill="#FFFFFF" font-size="10.5">UWB Mesh</text>
    </g>
  </g>

  <!-- Tile 2: Echo Sight -->
  <g transform="translate(480, 80)">
    <rect width="428" height="180" rx="10" fill="url(#tile_bg)" stroke="url(#tile_border_grad)" stroke-width="1.2" />
    <rect width="428" height="24" rx="10" fill="url(#cprj_sheen)" />

    <text x="18" y="26" fill="#FFFFFF" font-size="16" font-weight="800">👁️ Echo Sight</text>
    <text x="135" y="26" fill="#FF70A6" font-size="12" font-weight="600">// Multimodal Security</text>

    <text x="18" y="52" fill="#FFA8C5" font-size="11.5">
      <tspan x="18" dy="0">• Vision tracking (YOLOv8) + Acoustic anomaly (YAMNet)</tspan>
      <tspan x="18" dy="18">• Dynamic compute allocation &amp; baseline patrol bypass for CPU</tspan>
      <tspan x="18" dy="18">• Tactical command center UI with FastAPI &amp; LangGraph</tspan>
    </text>

    <!-- Badges -->
    <g transform="translate(18, 126)">
      <rect x="0" y="0" width="65" height="22" rx="4" fill="#14020C" stroke="#FF1A66" stroke-width="0.8" />
      <text x="10" y="15" fill="#FFFFFF" font-size="10.5">FastAPI</text>

      <rect x="73" y="0" width="80" height="22" rx="4" fill="#14020C" stroke="#FF1A66" stroke-width="0.8" />
      <text x="81" y="15" fill="#FFFFFF" font-size="10.5">LangGraph</text>

      <rect x="161" y="0" width="65" height="22" rx="4" fill="#14020C" stroke="#FF1A66" stroke-width="0.8" />
      <text x="169" y="15" fill="#FFFFFF" font-size="10.5">YOLOv8</text>

      <rect x="234" y="0" width="65" height="22" rx="4" fill="#14020C" stroke="#FF1A66" stroke-width="0.8" />
      <text x="242" y="15" fill="#FFFFFF" font-size="10.5">YAMNet</text>
    </g>
  </g>

  <!-- Tile 3: NeuralKPI -->
  <g transform="translate(32, 276)">
    <rect width="428" height="180" rx="10" fill="url(#tile_bg)" stroke="url(#tile_border_grad)" stroke-width="1.2" />
    <rect width="428" height="24" rx="10" fill="url(#cprj_sheen)" />

    <text x="18" y="26" fill="#FFFFFF" font-size="16" font-weight="800">🧠 NeuralKPI</text>
    <text x="135" y="26" fill="#FF70A6" font-size="12" font-weight="600">// AI-Native Campus OS</text>

    <text x="18" y="52" fill="#FFA8C5" font-size="11.5">
      <tspan x="18" dy="0">• Autonomous multi-agent college ERP system architecture</tspan>
      <tspan x="18" dy="18">• Dynamic routing engine powered by Gemini hybrid models</tspan>
      <tspan x="18" dy="18">• Synchronized voice-to-UI pipelines for institutional queries</tspan>
    </text>

    <!-- Badges -->
    <g transform="translate(18, 126)">
      <rect x="0" y="0" width="85" height="22" rx="4" fill="#14020C" stroke="#FF1A66" stroke-width="0.8" />
      <text x="8" y="15" fill="#FFFFFF" font-size="10.5">Multi-Agent</text>

      <rect x="93" y="0" width="85" height="22" rx="4" fill="#14020C" stroke="#FF1A66" stroke-width="0.8" />
      <text x="101" y="15" fill="#FFFFFF" font-size="10.5">Gemini API</text>

      <rect x="186" y="0" width="80" height="22" rx="4" fill="#14020C" stroke="#FF1A66" stroke-width="0.8" />
      <text x="194" y="15" fill="#FFFFFF" font-size="10.5">LangGraph</text>

      <rect x="274" y="0" width="60" height="22" rx="4" fill="#14020C" stroke="#FF1A66" stroke-width="0.8" />
      <text x="282" y="15" fill="#FFFFFF" font-size="10.5">Voice UI</text>
    </g>
  </g>

  <!-- Tile 4: Bharat AI Assistant -->
  <g transform="translate(480, 276)">
    <rect width="428" height="180" rx="10" fill="url(#tile_bg)" stroke="url(#tile_border_grad)" stroke-width="1.2" />
    <rect width="428" height="24" rx="10" fill="url(#cprj_sheen)" />

    <text x="18" y="26" fill="#FFFFFF" font-size="16" font-weight="800">📱 Bharat AI Assistant</text>
    <text x="200" y="26" fill="#FF70A6" font-size="12" font-weight="600">// On-Device Mobile AI</text>

    <text x="18" y="52" fill="#FFA8C5" font-size="11.5">
      <tspan x="18" dy="0">• Offline-first regional assistant optimized for native hardware</tspan>
      <tspan x="18" dy="18">• Localized inference with zero external cloud dependencies</tspan>
      <tspan x="18" dy="18">• Privacy-preserving regional language comprehension engine</tspan>
    </text>

    <!-- Badges -->
    <g transform="translate(18, 126)">
      <rect x="0" y="0" width="85" height="22" rx="4" fill="#14020C" stroke="#FF1A66" stroke-width="0.8" />
      <text x="8" y="15" fill="#FFFFFF" font-size="10.5">Offline-First</text>

      <rect x="93" y="0" width="85" height="22" rx="4" fill="#14020C" stroke="#FF1A66" stroke-width="0.8" />
      <text x="101" y="15" fill="#FFFFFF" font-size="10.5">On-Device AI</text>

      <rect x="186" y="0" width="85" height="22" rx="4" fill="#14020C" stroke="#FF1A66" stroke-width="0.8" />
      <text x="194" y="15" fill="#FFFFFF" font-size="10.5">Mobile Edge</text>

      <rect x="279" y="0" width="55" height="22" rx="4" fill="#14020C" stroke="#FF1A66" stroke-width="0.8" />
      <text x="287" y="15" fill="#FFFFFF" font-size="10.5">Python</text>
    </g>
  </g>
</svg>
