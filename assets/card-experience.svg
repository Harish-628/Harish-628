<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 200" width="100%" height="auto" style="border-radius: 14px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', sans-serif;">
  <defs>
    <linearGradient id="cexp_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240718" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#0E020A" stop-opacity="0.99" />
      <stop offset="100%" stop-color="#1C0513" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="cexp_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF70A6" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FF1A66" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#660A2B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFA8C5" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cexp_sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="cexp_glow" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#FF1A66" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#080205" stop-opacity="0" />
    </radialGradient>

    <filter id="cexp_shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="cexp_bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Glass Shell -->
  <g filter="url(#cexp_shadow)">
    <rect x="2" y="2" width="936" height="194" rx="14" fill="url(#cexp_bg)" />
    <rect x="2" y="2" width="936" height="194" fill="url(#cexp_glow)" />
    <rect x="2" y="2" width="936" height="50" rx="14" fill="url(#cexp_sheen)" />
    <rect x="2" y="2" width="936" height="194" rx="14" fill="none" stroke="url(#cexp_border)" stroke-width="1.6" />
  </g>

  <!-- Header -->
  <g transform="translate(32, 34)">
    <rect x="0" y="0" width="10" height="22" rx="3" fill="#FF1A66" filter="url(#cexp_bloom)">
      <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite" />
    </rect>
    <text x="20" y="16" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="1">
      02 // PROFESSIONAL INDUSTRY EXPERIENCE
    </text>
    <line x1="0" y1="28" x2="876" y2="28" stroke="#400015" stroke-width="1.2" stroke-dasharray="6 4" />
  </g>

  <!-- Role Details -->
  <g transform="translate(32, 78)">
    <text x="0" y="18" fill="#FFFFFF" font-size="18" font-weight="800">
      Software Engineering Intern
    </text>
    <text x="270" y="18" fill="#FF70A6" font-size="16" font-weight="700">
      @ DigiDARA Technologies
    </text>
    <text x="740" y="18" fill="#FFA8C5" font-size="12" font-family="'Courier New', monospace">
      APR 2026 – SEP 2026
    </text>

    <!-- Bullets -->
    <g transform="translate(0, 32)">
      <circle cx="6" cy="10" r="3.5" fill="#FF1A66" />
      <text x="18" y="14" fill="#FFA8C5" font-size="13">
        Architected and deployed AI-driven workflow engines to automate complex academic and campus operational pipelines.
      </text>

      <circle cx="6" cy="34" r="3.5" fill="#FFA8C5" />
      <text x="18" y="38" fill="#FFA8C5" font-size="13">
        Engineered resilient asynchronous backend services managing concurrent data processing and intelligent automation tasks.
      </text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="130" height="24" rx="5" fill="#14020C" stroke="#FF1A66" stroke-width="1" />
      <text x="14" y="16" fill="#FFFFFF" font-size="11">FastAPI Backend</text>

      <rect x="140" y="0" width="160" height="24" rx="5" fill="#14020C" stroke="#FF1A66" stroke-width="1" />
      <text x="154" y="16" fill="#FFFFFF" font-size="11">AI Workflow Engines</text>

      <rect x="310" y="0" width="150" height="24" rx="5" fill="#14020C" stroke="#FF1A66" stroke-width="1" />
      <text x="324" y="16" fill="#FFFFFF" font-size="11">Async Data Streams</text>

      <rect x="470" y="0" width="130" height="24" rx="5" fill="#14020C" stroke="#FF1A66" stroke-width="1" />
      <text x="484" y="16" fill="#FFFFFF" font-size="11">Docker Container</text>
    </g>
  </g>
</svg>
