<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 200" width="100%" height="auto" style="border-radius: 16px; overflow: hidden; background: #0A0207; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="exp_sri_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D0B1F" />
      <stop offset="50%" stop-color="#14030D" />
      <stop offset="100%" stop-color="#220616" />
    </linearGradient>

    <linearGradient id="exp_sri_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A3BC" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#991B48" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#D97298" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="exp_sri_sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="940" height="200" fill="url(#exp_sri_bg)" />
  <rect width="940" height="40" fill="url(#exp_sri_sheen)" />
  <rect x="2" y="2" width="936" height="196" rx="15" fill="none" stroke="url(#exp_sri_border)" stroke-width="1.6" />

  <g transform="translate(42, 34)">
    <text x="0" y="0" fill="#D97298" font-size="10.5" font-weight="700" letter-spacing="1.5" font-family="'Courier New', Courier, monospace">
      03 // INDUSTRY EXPERIENCE
    </text>

    <text x="0" y="32" fill="#FFFFFF" font-size="26" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="-0.3">
      DigiDARA Technologies <tspan fill="#E5A3BC" font-size="15" font-family="-apple-system, sans-serif" font-weight="400">// Software Engineering Intern</tspan>
    </text>

    <text x="0" y="58" fill="#F8EAF0" font-size="12.5" font-weight="400" fill-opacity="0.9">
      Architected and deployed AI-driven workflow engines to automate complex academic and campus operational pipelines.
    </text>

    <!-- 3 Metrics -->
    <g transform="translate(0, 96)">
      <g transform="translate(0, 0)">
        <text x="0" y="0" fill="#FFFFFF" font-size="20" font-weight="800">6 Months</text>
        <text x="0" y="16" fill="#D97298" font-size="10.5" font-weight="500">APR 2026 – SEP 2026</text>
      </g>

      <g transform="translate(160, 0)">
        <text x="0" y="0" fill="#FFFFFF" font-size="20" font-weight="800">100% Async</text>
        <text x="0" y="16" fill="#D97298" font-size="10.5" font-weight="500">concurrent data processing</text>
      </g>

      <g transform="translate(340, 0)">
        <text x="0" y="0" fill="#FFFFFF" font-size="20" font-weight="800">Dockerized</text>
        <text x="0" y="16" fill="#D97298" font-size="10.5" font-weight="500">scalable microservices</text>
      </g>
    </g>

    <!-- Tech Pills -->
    <g transform="translate(0, 136)">
      <rect x="0" y="0" width="80" height="24" rx="12" fill="#14020C" stroke="#7A1238" stroke-width="1" />
      <text x="40" y="15.5" fill="#E5A3BC" font-size="10.5" font-weight="600" text-anchor="middle">FastAPI</text>

      <rect x="88" y="0" width="130" height="24" rx="12" fill="#14020C" stroke="#7A1238" stroke-width="1" />
      <text x="153" y="15.5" fill="#E5A3BC" font-size="10.5" font-weight="600" text-anchor="middle">AI Workflow Engine</text>

      <rect x="226" y="0" width="115" height="24" rx="12" fill="#14020C" stroke="#7A1238" stroke-width="1" />
      <text x="283.5" y="15.5" fill="#E5A3BC" font-size="10.5" font-weight="600" text-anchor="middle">Async Streams</text>

      <rect x="349" y="0" width="80" height="24" rx="12" fill="#14020C" stroke="#7A1238" stroke-width="1" />
      <text x="389" y="15.5" fill="#E5A3BC" font-size="10.5" font-weight="600" text-anchor="middle">Docker</text>
    </g>
  </g>
</svg>
