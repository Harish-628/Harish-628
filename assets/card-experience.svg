<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="100%" height="auto" style="border-radius: 14px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', sans-serif;">
  <defs>
    <linearGradient id="exp_glass_fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240A1A" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#140610" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#1E0815" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="exp_glass_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B5C7" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#801D46" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#451126" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="exp_glass_sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="exp_glow" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <filter id="exp_shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="exp_glow_filt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base 3D Glass Shell -->
  <g filter="url(#exp_shadow)">
    <rect x="2" y="2" width="916" height="194" rx="14" fill="url(#exp_glass_fill)" />
    <rect x="2" y="2" width="916" height="194" rx="14" fill="url(#exp_glow)" />
    <rect x="2" y="2" width="916" height="50" rx="14" fill="url(#exp_glass_sheen)" />
    <rect x="2" y="2" width="916" height="194" rx="14" fill="none" stroke="url(#exp_glass_border)" stroke-width="1.6" />
  </g>

  <!-- Section Title Header -->
  <g transform="translate(32, 34)">
    <rect x="0" y="0" width="10" height="22" rx="3" fill="#E5B5C7" filter="url(#exp_glow_filt)">
      <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite" />
    </rect>
    <text x="20" y="16" fill="#F8F0F3" font-size="16" font-weight="800" letter-spacing="1">
      02 // PROFESSIONAL INDUSTRY EXPERIENCE
    </text>
    <line x1="0" y1="28" x2="856" y2="28" stroke="#451126" stroke-width="1.2" stroke-dasharray="6 4" />
  </g>

  <!-- Role Detail Box -->
  <g transform="translate(32, 78)">
    <!-- Role & Company -->
    <text x="0" y="18" fill="#FFFFFF" font-size="18" font-weight="800">
      Software Engineering Intern
    </text>
    <text x="270" y="18" fill="#C77B9B" font-size="16" font-weight="700">
      @ DigiDARA Technologies
    </text>
    <text x="730" y="18" fill="#E5B5C7" font-size="12" font-family="'Courier New', monospace" letter-spacing="0.5">
      APR 2026 – SEP 2026
    </text>

    <!-- Bullets -->
    <g transform="translate(0, 32)">
      <circle cx="6" cy="10" r="3.5" fill="#C77B9B" />
      <text x="18" y="14" fill="#E5B5C7" font-size="13">
        Architected and deployed AI-driven workflow engines to automate complex academic and campus operational pipelines.
      </text>

      <circle cx="6" cy="34" r="3.5" fill="#E5B5C7" />
      <text x="18" y="38" fill="#E5B5C7" font-size="13">
        Engineered resilient asynchronous backend services managing concurrent data processing and intelligent automation tasks.
      </text>
    </g>

    <!-- Tech Tags for Internship -->
    <g transform="translate(0, 88)">
      <rect x="0" y="0" width="130" height="24" rx="5" fill="#140610" stroke="#701A3D" stroke-width="1" />
      <text x="12" y="16" fill="#F8F0F3" font-size="11">FastAPI Backend</text>

      <rect x="140" y="0" width="160" height="24" rx="5" fill="#140610" stroke="#701A3D" stroke-width="1" />
      <text x="12" y="16" fill="#F8F0F3" font-size="11" transform="translate(140, 0)">AI Workflow Engines</text>

      <rect x="310" y="0" width="150" height="24" rx="5" fill="#140610" stroke="#701A3D" stroke-width="1" />
      <text x="12" y="16" fill="#F8F0F3" font-size="11" transform="translate(310, 0)">Async Data Streams</text>

      <rect x="470" y="0" width="130" height="24" rx="5" fill="#140610" stroke="#701A3D" stroke-width="1" />
      <text x="12" y="16" fill="#F8F0F3" font-size="11" transform="translate(470, 0)">Docker Container</text>
    </g>
  </g>
</svg>
