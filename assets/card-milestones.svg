<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 220" width="100%" height="auto" style="border-radius: 16px; overflow: hidden; background: #0A0207; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
