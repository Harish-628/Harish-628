<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 240" width="100%" height="auto" style="border-radius: 14px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', sans-serif;">
  <defs>
    <linearGradient id="cml_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240718" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#0E020A" stop-opacity="0.99" />
      <stop offset="100%" stop-color="#1C0513" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="cml_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF70A6" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FF1A66" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#660A2B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFA8C5" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cml_sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="cml_shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="cml_bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Glass Surface -->
  <g filter="url(#cml_shadow)">
    <rect x="2" y="2" width="936" height="234" rx="14" fill="url(#cml_bg)" />
    <rect x="2" y="2" width="936" height="50" rx="14" fill="url(#cml_sheen)" />
    <rect x="2" y="2" width="936" height="234" rx="14" fill="none" stroke="url(#cml_border)" stroke-width="1.6" />
  </g>

  <!-- Header -->
  <g transform="translate(32, 34)">
    <rect x="0" y="0" width="10" height="22" rx="3" fill="#FF1A66" filter="url(#cml_bloom)">
      <animate attributeName="fill-opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </rect>
    <text x="20" y="16" fill="#FFFFFF" font-size="16" font-weight="800" letter-spacing="1">
      05 // ACADEMIC &amp; CO-CURRICULAR MILESTONES
    </text>
    <line x1="0" y1="28" x2="876" y2="28" stroke="#400015" stroke-width="1.2" stroke-dasharray="6 4" />
  </g>

  <!-- Content List -->
  <g transform="translate(32, 80)">
    <!-- Milestone 1: College -->
    <g transform="translate(0, 0)">
      <circle cx="8" cy="10" r="5" fill="#400015" stroke="#FF1A66" stroke-width="1.5" />
      <circle cx="8" cy="10" r="2.5" fill="#FFFFFF" />
      <text x="24" y="14" fill="#FFFFFF" font-size="14" font-weight="700">
        B.Tech in Artificial Intelligence &amp; Data Science · Kongunadu College of Engineering and Technology
      </text>
      <text x="24" y="32" fill="#FFA8C5" font-size="12">
        2024 – 2028 (Expected) // Namakkal, Tamil Nadu, India
      </text>
    </g>

    <!-- Milestone 2: Hackathon -->
    <g transform="translate(0, 52)">
      <circle cx="8" cy="10" r="5" fill="#400015" stroke="#FF70A6" stroke-width="1.5" />
      <circle cx="8" cy="10" r="2.5" fill="#FFFFFF" />
      <text x="24" y="14" fill="#FFFFFF" font-size="14" font-weight="700">
        Team Falcon — Competitive Hackathon Bangalore (Oct 2026)
      </text>
      <text x="24" y="32" fill="#FFA8C5" font-size="12">
        Represented collegiate engineering team tackling high-stakes computational and autonomous systems challenges.
      </text>
    </g>

    <!-- Milestone 3: Presentation -->
    <g transform="translate(0, 104)">
      <circle cx="8" cy="10" r="5" fill="#400015" stroke="#FF1A66" stroke-width="1.5" />
      <circle cx="8" cy="10" r="2.5" fill="#FFFFFF" />
      <text x="24" y="14" fill="#FFFFFF" font-size="14" font-weight="700">
        Technical Paper Presentation: Neuralink &amp; Brain-Computer Interfaces (Jan 2025)
      </text>
      <text x="24" y="32" fill="#FFA8C5" font-size="12">
        Delivered comprehensive architectural presentation on neural telemetry arrays and BCI hardware integration.
      </text>
    </g>
  </g>
</svg>
