<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 240" width="100%" height="auto" style="border-radius: 16px; overflow: hidden; background: #0A0207; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Sri Tech Project Card Gradient -->
    <linearGradient id="p_bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D0B1F" />
      <stop offset="50%" stop-color="#14030D" />
      <stop offset="100%" stop-color="#3A0822" />
    </linearGradient>

    <radialGradient id="p_right_glow" cx="88%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#991B48" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#550A26" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#14030D" stop-opacity="0" />
    </radialGradient>

    <!-- Bevel Border -->
    <linearGradient id="p_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A3BC" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#991B48" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#3D061C" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D97298" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="p_sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="p_bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Shell -->
  <rect width="940" height="240" fill="url(#p_bg_grad)" />
  <rect width="940" height="240" fill="url(#p_right_glow)" />
  <rect width="940" height="50" fill="url(#p_sheen)" />
  <rect x="2" y="2" width="936" height="236" rx="15" fill="none" stroke="url(#p_border)" stroke-width="1.6" />

  <!-- Left Content Column (620px wide) -->
  <g transform="translate(42, 32)">
    <!-- Metadata Tag -->
    <text x="0" y="0" fill="#D97298" font-size="10.5" font-weight="700" letter-spacing="1.5" font-family="'Courier New', Courier, monospace">
      03 • EDGE AI • SENSOR TELEMETRY • 2026
    </text>

    <!-- Main Title in Editorial Serif/Bold -->
    <text x="0" y="34" fill="#FFFFFF" font-size="28" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="-0.3">
      PRISM <tspan fill="#E5A3BC" font-size="16" font-family="-apple-system, sans-serif" font-weight="400">// Predictive Rescue Intel</tspan>
    </text>

    <!-- Subtitle / One-Liner -->
    <text x="0" y="58" fill="#F8EAF0" font-size="12.5" font-weight="400" fill-opacity="0.9">
      Urban search-and-rescue platform combining 60GHz mmWave radar &amp; 24-bit geophone telemetry.
    </text>

    <!-- Built Highlight -->
    <text x="0" y="78" fill="#D97298" font-size="11" font-weight="600" font-family="'Courier New', Courier, monospace">
      BUILT • Edge-AI Wavelet Packet Decomp on ESP32-S3 + subterranean UWB mesh relay
    </text>

    <!-- 3 Key Metric Stats Columns (Sri Tech Signature) -->
    <g transform="translate(0, 114)">
      <!-- Metric 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" fill="#FFFFFF" font-size="20" font-weight="800">60 GHz</text>
        <text x="0" y="16" fill="#D97298" font-size="10.5" font-weight="500">radar sensor array</text>
      </g>

      <!-- Metric 2 -->
      <g transform="translate(140, 0)">
        <text x="0" y="0" fill="#FFFFFF" font-size="20" font-weight="800">24-bit</text>
        <text x="0" y="16" fill="#D97298" font-size="10.5" font-weight="500">geophone ADC precision</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(300, 0)">
        <text x="0" y="0" fill="#FFFFFF" font-size="20" font-weight="800">&lt;15 ms</text>
        <text x="0" y="16" fill="#D97298" font-size="10.5" font-weight="500">edge anomaly latency</text>
      </g>
    </g>

    <!-- Technology Pills Row -->
    <g transform="translate(0, 154)">
      <rect x="0" y="0" width="75" height="24" rx="12" fill="#14020C" stroke="#7A1238" stroke-width="1" />
      <text x="37.5" y="15.5" fill="#E5A3BC" font-size="10.5" font-weight="600" text-anchor="middle">ESP32-S3</text>

      <rect x="83" y="0" width="65" height="24" rx="12" fill="#14020C" stroke="#7A1238" stroke-width="1" />
      <text x="115.5" y="15.5" fill="#E5A3BC" font-size="10.5" font-weight="600" text-anchor="middle">Edge AI</text>

      <rect x="156" y="0" width="95" height="24" rx="12" fill="#14020C" stroke="#7A1238" stroke-width="1" />
      <text x="203.5" y="15.5" fill="#E5A3BC" font-size="10.5" font-weight="600" text-anchor="middle">mmWave Radar</text>

      <rect x="259" y="0" width="80" height="24" rx="12" fill="#14020C" stroke="#7A1238" stroke-width="1" />
      <text x="299" y="15.5" fill="#E5A3BC" font-size="10.5" font-weight="600" text-anchor="middle">UWB Mesh</text>

      <rect x="347" y="0" width="95" height="24" rx="12" fill="#14020C" stroke="#7A1238" stroke-width="1" />
      <text x="394.5" y="15.5" fill="#E5A3BC" font-size="10.5" font-weight="600" text-anchor="middle">Wavelet Decomp</text>
    </g>
  </g>

  <!-- Right Graphic Column (3D Isometric Sensor & Radar Graphic) -->
  <g transform="translate(760, 120)">
    <!-- Radar concentric arcs -->
    <circle r="75" fill="none" stroke="#D97298" stroke-width="1" stroke-dasharray="8 6" stroke-opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite" />
    </circle>
    <circle r="52" fill="none" stroke="#FF2A6D" stroke-width="1.2" stroke-opacity="0.5" />
    <circle r="30" fill="none" stroke="#E5A3BC" stroke-width="1.4" stroke-opacity="0.7">
      <animate attributeName="r" values="28;34;28" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle r="6" fill="#FFFFFF" filter="url(#p_bloom)" />

    <!-- Isometric Antenna Beam -->
    <path d="M 0 0 L 45 -45 L 60 -35 L 15 10 Z" fill="#991B48" opacity="0.4" />
    <line x1="0" y1="0" x2="60" y2="-60" stroke="#FF70A6" stroke-width="1.8" filter="url(#p_bloom)" />

    <!-- Waveform spike overlay -->
    <path d="M -55 35 L -35 35 L -25 15 L -15 50 L -5 20 L 5 40 L 15 35 L 55 35" fill="none" stroke="#E5A3BC" stroke-width="1.5" stroke-linecap="round" />

    <!-- Indicator badge -->
    <g transform="translate(25, 45)">
      <rect width="80" height="20" rx="10" fill="#14020C" stroke="#7A1238" stroke-width="0.8" />
      <text x="40" y="13.5" fill="#FFA8C5" font-size="9" font-family="'Courier New', monospace" text-anchor="middle">RADAR // ACTIVE</text>
    </g>
  </g>
</svg>
