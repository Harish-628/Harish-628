<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 44" width="100%" height="auto" style="border-radius: 9px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Ubuntu', monospace;">
  <defs>
    <linearGradient id="hud_bar_bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14020C" />
      <stop offset="50%" stop-color="#080205" />
      <stop offset="100%" stop-color="#14020C" />
    </linearGradient>
  </defs>

  <rect width="940" height="44" fill="url(#hud_bar_bg)" rx="9" stroke="#540824" stroke-width="1.2" />

  <!-- Badge 1: GitHub -->
  <g transform="translate(18, 7)">
    <rect width="165" height="30" rx="6" fill="#0A0206" stroke="#990033" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#FF1A66">
      <animate attributeName="fill-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="19" fill="#FFFFFF" font-size="11.5" font-weight="700">GITHUB</text>
    <text x="82" y="19" fill="#FF70A6" font-size="11.5">@Harish-628</text>
  </g>

  <!-- Badge 2: Multi-Agent AI -->
  <g transform="translate(195, 7)">
    <rect width="215" height="30" rx="6" fill="#0A0206" stroke="#540824" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#FFA8C5" />
    <text x="28" y="19" fill="#FFFFFF" font-size="11.5" font-weight="700">FOCUS</text>
    <text x="75" y="19" fill="#FFA8C5" font-size="11.5">Multi-Agent AI &amp; Edge</text>
  </g>

  <!-- Badge 3: Stack -->
  <g transform="translate(422, 7)">
    <rect width="185" height="30" rx="6" fill="#0A0206" stroke="#540824" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#FF1A66" />
    <text x="28" y="19" fill="#FFFFFF" font-size="11.5" font-weight="700">STACK</text>
    <text x="75" y="19" fill="#FF70A6" font-size="11.5">FastAPI • LangGraph</text>
  </g>

  <!-- Badge 4: Arch Linux -->
  <g transform="translate(619, 7)">
    <rect width="155" height="30" rx="6" fill="#0A0206" stroke="#540824" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#FFA8C5" />
    <text x="28" y="19" fill="#FFFFFF" font-size="11.5" font-weight="700">OS</text>
    <text x="54" y="19" fill="#FFA8C5" font-size="11.5">Arch • Xubuntu</text>
  </g>

  <!-- Badge 5: Status -->
  <g transform="translate(786, 7)">
    <rect width="136" height="30" rx="6" fill="#1A0310" stroke="#FF1A66" stroke-width="1" />
    <circle cx="14" cy="15" r="4" fill="#FF1A66">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="19" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="0.5">OPEN TO BUILD</text>
  </g>
</svg>
